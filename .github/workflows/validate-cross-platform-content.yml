name: Validate Cross-Platform Content

on:
  push:
    branches:
      - implementation/cross-platform-content-architecture
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate brand registry
        run: node scripts/validate-brand-registry.mjs

      - name: Validate JSON files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path('content'),
              Path('assets/brand-tokens'),
              Path('schemas'),
              Path('integrations'),
              Path('manifests'),
              Path('public'),
          ]
          count = 0
          for root in paths:
              if not root.exists():
                  continue
              for path in root.rglob('*.json'):
                  json.loads(path.read_text(encoding='utf-8'))
                  count += 1
          print(f'Validated {count} JSON files.')
          PY

      - name: Scan public repository for forbidden secret patterns
        shell: bash
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.md' '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|sk-proj-|CONVEX_DEPLOY_KEY=|SECRET_KEY=|RAILWAY_TOKEN=|RAILWAY_API_TOKEN=)' .; then
            echo 'Forbidden secret-like content detected.' >&2
            exit 1
          fi
          echo 'No forbidden secret patterns detected.'
