name: Deploy Google Sites Bridge

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Optional first-time bootstrap. The repository secret PAGES_ADMIN_TOKEN
      # must be a fine-grained token limited to this repository with
      # Administration: write and Pages: write. Normal deployments do not
      # require this secret after Pages has been enabled once.
      - name: Enable and configure Pages (secure bootstrap)
        if: ${{ env.PAGES_ADMIN_TOKEN != '' }}
        uses: actions/configure-pages@v5
        with:
          token: ${{ env.PAGES_ADMIN_TOKEN }}
          enablement: true

      - name: Configure existing Pages site
        if: ${{ env.PAGES_ADMIN_TOKEN == '' }}
        uses: actions/configure-pages@v5

      - name: Upload bridge artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
