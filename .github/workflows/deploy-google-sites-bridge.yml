name: Deploy Google Sites Bridge

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-google-sites-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: google-sites-bridge-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
      PUBLIC_FEED: https://charming-lapwing-610.eu-west-1.convex.site/repository/public

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate bridge package
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -f docs/styles.css
          test -f docs/app.js
          grep -Fq "$PUBLIC_FEED" docs/app.js
          echo "Bridge package files and configured feed are present."

      - name: Validate public feed safety
        shell: bash
        run: |
          set -euo pipefail
          payload="$(curl --fail --silent --show-error --retry 3 "$PUBLIC_FEED")"
          count="$(jq -r '.count' <<<"$payload")"
          test "$count" -ge 1
          if jq -e '.items[] | has("sourceUrl") or has("contentJson") or has("sourceSystem")' <<<"$payload" >/dev/null; then
            echo "Sensitive/internal fields were found in the public feed." >&2
            exit 1
          fi
          echo "Public feed validated with $count record(s) and no blocked fields."

      - name: Enable and configure Pages (secure bootstrap)
        id: bootstrap
        if: ${{ env.PAGES_ADMIN_TOKEN != '' }}
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          token: ${{ env.PAGES_ADMIN_TOKEN }}
          enablement: true

      - name: Configure existing Pages site
        id: configure
        if: ${{ env.PAGES_ADMIN_TOKEN == '' }}
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload bridge artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ steps.bootstrap.outcome == 'success' || steps.configure.outcome == 'success' }}
        uses: actions/deploy-pages@v5

      - name: Record deployment status
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Google Sites Bridge"
            echo
            echo "- Bridge package validation: complete"
            echo "- Public feed security validation: complete"
            if [[ "${{ steps.deployment.outcome }}" == "success" ]]; then
              echo "- GitHub Pages deployment: complete"
              echo "- Published URL: ${{ steps.deployment.outputs.page_url }}"
            else
              echo "- GitHub Pages deployment: pending repository Pages enablement"
              echo "- The validated artifact remains ready for deployment as soon as Pages is enabled."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
